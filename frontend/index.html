<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1722" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BeBetter" />
  
  <!-- SEO Meta Tags -->
  <title>BeBetter — Self-Hosted Habit Builder, Task Manager & Social Challenges</title>
  <meta name="description" content="BeBetter is a premium, mobile-first companion app to build strong habits, manage tasks, and challenge friends. Get started free and build routines that last." />
  <meta name="keywords" content="habit tracker, task manager, social accountability, self-hosted, bebetter, build habits, friend challenges, contribution grid, routine builder, streaks" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://bebetter.websters.at/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bebetter.websters.at/" />
  <meta property="og:title" content="BeBetter — Build Habits & Challenge Friends" />
  <meta property="og:description" content="Self-hosted, mobile-first habit tracker and task companion with streaks, precise reminders, buddy co-signing, and dual matches." />
  <meta property="og:image" content="https://bebetter.websters.at/og-image.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://bebetter.websters.at/" />
  <meta property="twitter:title" content="BeBetter — Build Habits & Challenge Friends" />
  <meta property="twitter:description" content="Self-hosted, mobile-first habit tracker with streaks, precise reminders, accountability buddies, and challenges." />
  <meta property="twitter:image" content="https://bebetter.websters.at/og-image.png" />

  <!-- Structured Data / JSON-LD -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BeBetter",
      "url": "https://bebetter.websters.at/",
      "description": "Premium, mobile-first habit tracker and task companion with streaks, precise reminders, buddy co-signing, and dual matches.",
      "applicationCategory": "HealthAndGymApplication, LifestyleApplication",
      "operatingSystem": "iOS, Android, Windows, macOS, Linux",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
  </script>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://bebetter.websters.at" />
  <link rel="dns-prefetch" href="https://bebetter.websters.at" />
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        document.body.className = 'bg-gray-100 text-gray-900 min-h-[100dvh] overscroll-none';
      }
    })();
  </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-[100dvh] overscroll-none">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
